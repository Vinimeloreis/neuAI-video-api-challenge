name: Deploy API
run-name: Deploy API on EC2 VM
on: [push]
jobs:
  deploy-on-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Validar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem

          echo "Primeira linha:"
          head -n 1 ~/.ssh/ec2-key.pem

          echo "Última linha:"
          tail -n 1 ~/.ssh/ec2-key.pem

          ssh-keygen -y -f ~/.ssh/ec2-key.pem > /dev/null

          echo "Chave válida!"
      - name: Update EC2 VM
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /home/ec2-user/neuAI-video-api-challenge

            git pull origin main

            docker compose up -d --build

            docker compose ps
          EOF
